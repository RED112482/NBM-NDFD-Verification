name: Build historical NBM/NDFD guidance and deploy

on:
  workflow_dispatch:
  schedule:
    - cron: "40 16 * * *"
  push:
    branches: [main]
    paths:
      - "scripts/build_history.py"
      - "scripts/build_guidance.py"
      - "site/data/guidance.json"
      - ".github/workflows/history.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: nbm-historical
  cancel-in-progress: true

jobs:
  history:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install GRIB and spatial dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libg2c-dev
          pip install -r requirements.txt
          pip install grib2io --config-settings=cmake.define.GRIB2IO_WITH_IP=OFF
      - name: Generate actual historical grids from NOAA Open Data
        env:
          HISTORY_DAYS: "5"
          DEBUG_QMD: "0"
        run: python -u scripts/build_history.py
      - name: Validate history and provenance
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          p=json.loads(Path("site/data/history.json").read_text())
          assert p["schemaVersion"]==1
          assert p["office"]=="MOB"
          assert len(p["points"])>100
          assert len(p["days"]["mint"])>=5
          for day,block in p["days"]["mint"].items():
              for lead in ("12","24","36","48","60"):
                  assert lead in block["leads"], (day,lead)
          print("Historical datasets:", {k: len(v) for k,v in p["days"].items()})
          print("NBM deterministic available:",
                sum(bool(x["nbm"]["det"]) for entries in p["days"].values()
                    for day in entries.values() for x in day["leads"].values()))
          assert len(p.get("audit", [])) >= 50, "Expected 5 days x 5 leads x 2 elements"
          from datetime import datetime, timedelta
          problems=[]
          for row in p["audit"]:
              for source in ("ndfd", "nbmDet"):
                  item=row.get(source, {})
                  if "meta" not in item:
                      continue
                  meta=item["meta"]
                  start,end=meta.get("startStep"),meta.get("endStep")
                  if start is None or end is None or abs((end-start)-12)>0.01:
                      problems.append((row["product"],row["validUtc"],row["nominalLead"],source,"not 12 hours"))
                  if source=="ndfd" and meta.get("landCoverageFraction",0)<0.8:
                      problems.append((row["product"],row["validUtc"],row["nominalLead"],source,"insufficient coverage"))
                  if source=="ndfd" and meta.get("decoder")!="NOAA-MDL grib2io":
                      problems.append((row["product"],row["validUtc"],row["nominalLead"],source,"wrong decoder"))
                  if meta.get("actualWindowEndUtc")!=row["validUtc"]:
                      problems.append((row["product"],row["validUtc"],row["nominalLead"],source,"end mismatch"))
                  actual_start=datetime.fromisoformat(row["validUtc"].replace("Z","+00:00"))-timedelta(hours=12)
                  if meta.get("actualWindowStartUtc")!=actual_start.isoformat().replace("+00:00","Z"):
                      problems.append((row["product"],row["validUtc"],row["nominalLead"],source,"start mismatch"))
                  if source=="ndfd" and meta.get("issuedUtc") and meta["issuedUtc"]>row["referenceUtc"]:
                      problems.append((row["product"],row["validUtc"],row["nominalLead"],source,"issued after cutoff"))
                  for analysis in ("URMA","RTMA"):
                      verification=item.get(analysis,{})
                      if verification.get("absErrorOver20F",0):
                          print("REVIEW >20F:",row["product"],row["validUtc"],
                                "lead",row["nominalLead"],source,analysis,verification)
          assert not problems, "Invalid extrema GRIB metadata: "+str(problems[:15])
          # Verify separate scientific windows are published correctly.
          from datetime import datetime, timedelta
          validated = {"12h":0,"18h":0}
          for product,days in p["days"].items():
              for valid_key,day in days.items():
                  valid = datetime.fromisoformat(valid_key.replace("Z","+00:00"))
                  for key,hours in (("analysis",12),("rtma",12),
                                    ("analysis18",18),("rtma18",18)):
                      a = day.get(key)
                      if a is None:
                          continue
                      assert a["meta"].get("periodHours")==hours,(product,valid_key,key)
                      expected_end=valid+timedelta(hours=6 if hours==18 else 0)
                      assert datetime.fromisoformat(a["meta"]["endUtc"].replace("Z","+00:00"))==expected_end
                      assert a["meta"]["hourlySamples"]==hours+1
                      validated[f"{hours}h"]+=1
                  for slot in day["leads"].values():
                      for pct,layer in slot["nbm"].get("percentiles",{}).items():
                          assert layer["meta"].get("periodHours")==18, (product,valid_key,pct)
          print("Validated distinct analysis extrema windows:",validated)
          print("Validated five-day metadata audit:", len(p["audit"]), "records")

          PY
      - name: Commit updated historical guidance
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/history.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh historical NBM NDFD lead-time grids"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: history
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy historical viewer to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
