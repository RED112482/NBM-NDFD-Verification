name: Build historical NBM/NDFD guidance and deploy

on:
  workflow_dispatch:
  schedule:
    - cron: "40 16 * * *"
  push:
    branches: [main]
    paths:
      - "scripts/build_history.py"
      - "scripts/build_guidance.py"
      - "site/data/guidance.json"
      - ".github/workflows/history.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: nbm-historical
  cancel-in-progress: true

jobs:
  history:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install GRIB and spatial dependencies
        run: pip install -r requirements.txt
      - name: Generate actual historical grids from NOAA Open Data
        env:
          HISTORY_DAYS: "5"
          DEBUG_QMD: "0"
        run: python -u scripts/build_history.py
      - name: Validate history and provenance
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          p=json.loads(Path("site/data/history.json").read_text())
          assert p["schemaVersion"]==1
          assert p["office"]=="MOB"
          assert len(p["points"])>100
          assert len(p["days"]["mint"])>=5
          for day,block in p["days"]["mint"].items():
              for lead in ("12","24","36","48","60"):
                  assert lead in block["leads"], (day,lead)
          print("Historical datasets:", {k: len(v) for k,v in p["days"].items()})
          print("NBM deterministic available:",
                sum(bool(x["nbm"]["det"]) for entries in p["days"].values()
                    for day in entries.values() for x in day["leads"].values()))
          PY
      - name: Commit updated historical guidance
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/history.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh historical NBM NDFD lead-time grids"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: history
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy historical viewer to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
