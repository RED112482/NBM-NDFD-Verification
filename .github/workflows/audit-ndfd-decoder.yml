name: Independent archived NDFD decoder comparison (read-only)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/audit-ndfd-decoder.yml"
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install separate GRIB decoders
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libg2c-dev
          python -m pip install --upgrade pip
          pip install numpy boto3 eccodes
          pip install grib2io --config-settings=cmake.define.GRIB2IO_WITH_IP=OFF
      - name: Compare NOAA NDFD raw MinT archive by independent decoders
        run: |
          python - <<'PY'
          import tempfile, pathlib
          import boto3, numpy as np
          import grib2io
          from botocore import UNSIGNED
          from botocore.config import Config
          from eccodes import codes_grib_new_from_file, codes_get_array, codes_get, codes_release

          key="wmo/mint/2026/11/14/YHUZ98_KWBN_202611142346"
          s3=boto3.client("s3",region_name="us-east-1",config=Config(signature_version=UNSIGNED))
          with tempfile.TemporaryDirectory() as d:
              file=pathlib.Path(d)/"mint.grb2"
              s3.download_file("noaa-ndfd-pds",key,str(file))
              print("SOURCE",key,"BYTES",file.stat().st_size,flush=True)
              cities={"Mobile":(30.6954,-88.0399),"Evergreen":(31.4335,-86.9569),
                      "Waynesboro":(31.6749,-88.6462),"Pensacola":(30.4213,-87.2169)}
              def sample(vals,lats,lons):
                  arr=np.asarray(vals,dtype=float).ravel()
                  la=np.asarray(lats,dtype=float).ravel()
                  lo=np.asarray(lons,dtype=float).ravel()
                  lo=np.where(lo>180,lo-360,lo)
                  found={}
                  for city,(lat,lon) in cities.items():
                      d=(la-lat)**2+((lo-lon)*.86)**2
                      idx=int(np.nanargmin(d))
                      value=float(arr[idx])
                      if value>180: value=(value-273.15)*1.8+32
                      found[city]={"F":round(value,2),"lat":round(float(la[idx]),4),
                                   "lon":round(float(lo[idx]),4),
                                   "distanceDeg":round(float(np.sqrt(d[idx])),5)}
                  return found
              original=[]
              with open(file,"rb") as f:
                  while True:
                      g=codes_grib_new_from_file(f)
                      if g is None:break
                      try:
                          date=str(codes_get(g,"validityDate"))
                          time=str(codes_get(g,"validityTime"))
                          cells=sample(codes_get_array(g,"values"),
                                       codes_get_array(g,"latitudes"),
                                       codes_get_array(g,"longitudes"))
                          original.append((date,time,cells))
                      finally:codes_release(g)
              alternate=[]
              with grib2io.open(str(file)) as records:
                  for msg in records:
                      lat,lon=msg.latlons()
                      cells=sample(msg.data,lat,lon)
                      alternate.append(cells)
              print("ECCODES MESSAGES",len(original),"GRIB2IO MESSAGES",len(alternate))
              for i in range(min(len(original),len(alternate))):
                  print("MESSAGE",i,"ECCODES VALID",original[i][0],original[i][1])
                  for city in cities:
                      x=original[i][2][city];y=alternate[i][city]
                      print(city,"eccodes",x,"grib2io",y,
                            "DELTA_F",round(x["F"]-y["F"],2),flush=True)
              if not original or not alternate:
                  raise SystemExit("Could not decode both sources")
              print("NDFD COMPARISON COMPLETE - no production files touched")
              # Independent NBM deterministic comparison for the same
              # November 15 12Z valid MinT from the 13Z November 14 run.
              nbmkey="blend.20261114/13/core/blend.t13z.core.f023.co.grib2"
              nbms3=boto3.client("s3",region_name="us-east-1",config=Config(signature_version=UNSIGNED))
              idx=nbms3.get_object(Bucket="noaa-nbm-grib2-pds",Key=nbmkey+".idx")["Body"].read().decode().splitlines()
              choices=[i for i,row in enumerate(idx) if ":TMIN:" in row.upper() and "MIN FCST" in row.upper()]
              print("NBM CORE CANDIDATES",[(i,idx[i]) for i in choices[:5]],flush=True)
              if not choices:raise RuntimeError("No deterministic MinT record")
              i=choices[0]
              start=int(idx[i].split(":")[1])
              end=int(idx[i+1].split(":")[1])-1 if i+1<len(idx) else nbms3.head_object(
                 Bucket="noaa-nbm-grib2-pds",Key=nbmkey)["ContentLength"]-1
              chunk=nbms3.get_object(Bucket="noaa-nbm-grib2-pds",Key=nbmkey,
                       Range=f"bytes={start}-{end}")["Body"].read()
              nbmfile=pathlib.Path(d)/"nbm_det.grib2";nbmfile.write_bytes(chunk)
              with open(nbmfile,"rb") as f:
                  g=codes_grib_new_from_file(f)
                  if g is None:raise RuntimeError("Cannot read NBM selected message")
                  try:
                      valid=(str(codes_get(g,"validityDate")),str(codes_get(g,"validityTime")))
                      ec=sample(codes_get_array(g,"values"),codes_get_array(g,"latitudes"),
                                codes_get_array(g,"longitudes"))
                  finally:codes_release(g)
              with grib2io.open(str(nbmfile)) as f:
                  msg=next(iter(f))
                  la,lo=msg.latlons()
                  alt=sample(msg.data,la,lo)
              print("NBM CORE VALID",valid,"SOURCE",nbmkey,flush=True)
              for city in cities:
                  x=ec[city];y=alt[city]
                  print("NBM",city,"eccodes",x,"grib2io",y,
                        "DELTA_F",round(x["F"]-y["F"],2),flush=True)
              print("BOTH DATA SOURCES CHECKED INDEPENDENTLY")
          PY
