name: Probe PoP12 & recent URMA source inventories (read-only)
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/probe-pop.yml"
      - "scripts/probe_pop.py"
      - "scripts/probe_pop_metadata.py"
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y libg2c-dev
          pip install -r requirements.txt
          pip install grib2io --config-settings=cmake.define.GRIB2IO_WITH_IP=OFF
      - run: python -u scripts/probe_pop_metadata.py
